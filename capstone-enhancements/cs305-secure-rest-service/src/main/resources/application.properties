# TLS (merged from CS-305 Project Two / the Module Five checksum server).
# Every endpoint in this service now runs behind this configuration -
# there is no longer a separate, disconnected plaintext-HTTP CRUD server.
server.port=8443
server.ssl.key-alias=tomcat
server.ssl.key-store-password=${APP_KEYSTORE_PASSWORD:changeit-dev-only}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12

# Credentials for the two in-memory accounts (reader / admin). The
# "changeit-*" values only take effect when the corresponding env var is
# unset, which is true for a local dev run; any real deployment must set
# APP_USER_PASSWORD / APP_ADMIN_PASSWORD / APP_KEYSTORE_PASSWORD.
app.security.user-password=${APP_USER_PASSWORD:changeit-user}
app.security.admin-password=${APP_ADMIN_PASSWORD:changeit-admin}

server.error.include-message=never
server.error.include-stacktrace=never
